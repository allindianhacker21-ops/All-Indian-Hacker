<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naresh Indian Hacker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            margin: 30px auto;
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.25);
            border: 1px solid #334155;
        }
        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            margin-bottom: 15px;
        }
        h1 {
            color: #00ff88;
            font-size: 1.8rem;
            margin: 10px 0 5px 0;
        }
        .status-badge {
            display: inline-block;
            background: #064e3b;
            color: #34d399;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid #10b981;
            margin-bottom: 15px;
        }
        .form-box {
            background: #0f172a;
            padding: 18px;
            border-radius: 12px;
            margin: 18px 0;
            border: 1px solid #334155;
            text-align: left;
        }
        .box-title {
            color: #00ff88;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 0.9rem;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #00ff88;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #00ff88;
            color: #0f172a;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .submit-btn:hover {
            background: #34d399;
            transform: translateY(-2px);
        }
        .btn {
            display: block;
            width: 90%;
            margin: 12px auto;
            padding: 12px 0;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            transition: 0.3s;
            font-size: 0.95rem;
        }
        .btn-contact { background: linear-gradient(45deg, #00b09b, #96c93d); color: #0f172a; }
        .btn-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .btn-yt { background-color: #ff0000; }
        .btn:hover { transform: translateY(-3px); opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Photo -->
        <img src="file_00000000f45c71f4b4777bfb557ca3ca.png" alt="Naresh" class="profile-pic">

        <h1>Naresh Indian Hacker</h1>
        
        <!-- Live Status Badge -->
        <div class="status-badge">🟢 Currently Online / Live Class</div>

        <!-- Contact Button -->
        <a href="#contactSection" class="btn btn-contact">📞 Contact Us / Join Online Class</a>

        <!-- Social Links Buttons -->
        <a href="https://instagram.com/ankitandnaresh" class="btn btn-insta" target="_blank">📸 Follow on Instagram</a>
        <a href="https://www.youtube.com/@NareshIndianHacker" class="btn btn-yt" target="_blank">▶️ Subscribe on YouTube</a>

        <!-- Contact Us Form Section -->
        <div class="form-box" id="contactSection">
            <div class="box-title">📩 Contact Us Form</div>
            <form id="userForm">
                <div class="form-group">
                    <label for="fullName">Aapka Naam (Full Name):</label>
                    <input type="text" id="fullName" placeholder="Apna naam likhein" required>
                </div>

                <div class="form-group">
                    <label for="userCountry">Country (Desh):</label>
                    <select id="userCountry" required>
                        <option value="">-- Country Select Karein --</option>
                        <option value="India">India 🇮🇳</option>
                        <option value="Nepal">Nepal 🇳🇵</option>
                        <option value="Bangladesh">Bangladesh 🇧🇩</option>
                        <option value="Other">Other Country</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="userState">State (Rajya):</label>
                    <select id="userState" required>
                        <option value="">-- State Select Karein --</option>
                        <option value="Rajasthan">Rajasthan</option>
                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                        <option value="Bihar">Bihar</option>
                        <option value="Madhya Pradesh">Madhya Pradesh</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Haryana">Haryana</option>
                        <option value="Punjab">Punjab</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Gujarat">Gujarat</option>
                        <option value="Other">Other State</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="userAddress">Aapka Pata (District / City / Gaanv):</label>
                    <input type="text" id="userAddress" placeholder="Zila / Sehar ya Gaanv ka naam" required>
                </div>

                <div class="form-group">
                    <label for="userContact">Mobile No. ya Email:</label>
                    <input type="text" id="userContact" placeholder="Phone number likhein" required>
                </div>

                <div class="form-group">
                    <label for="userMessage">Message / Sawaal:</label>
                    <textarea id="userMessage" rows="3" placeholder="Apna message yahan likhein..."></textarea>
                </div>

                <button type="button" class="submit-btn" onclick="saveDetails()">Submit & Save Details 🚀</button>
            </form>
        </div>
    </div>

    <script>
        function saveDetails() {
            const name = document.getElementById('fullName').value;
            const country = document.getElementById('userCountry').value;
            const state = document.getElementById('userState').value;
            const address = document.getElementById('userAddress').value;
            const contact = document.getElementById('userContact').value;

            if(name === '' || country === '' || state === '' || address === '' || contact === '') {
                alert('Kripya Naam, Country, State, Pata aur Mobile Number sabhi bharein!');
                return;
            }

            alert('Dhanyawad ' + name + '! Aapki details save ho gayi hain. Naresh jaldi hi aapse contact karega.');
            document.getElementById('userForm').reset();
        }
    </script>

</body>
</html>
