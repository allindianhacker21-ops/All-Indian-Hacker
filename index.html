<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Indian Hacker</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding-right: 20px;
            margin-top: 20px;
        }

        .open-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        }

        .open-btn:hover {
            background-color: darkred;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .signup-box {
            background: #111111;
            border: 1px solid red;
            padding: 25px;
            border-radius: 8px;
            width: 290px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            position: relative;
        }

        .signup-box h2 {
            color: red;
            margin-top: 0;
            font-size: 20px;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: red;
            font-size: 22px;
            cursor: pointer;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ddd;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            outline: none;
        }

        .input-group input:focus {
            border-color: red;
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>

    <h1>All Indian Hacker</h1>

    <div class="top-bar">
        <button class="open-btn" onclick="openForm()">Sign Up</button>
    </div>

    <div class="modal-overlay" id="signupModal">
        <div class="signup-box">
            <span class="close-btn" onclick="closeForm()">&times;</span>
            <h2>Sign Up</h2>
            <form action="https://formspree.io/f/mljrwyeo" method="POST">
                <div class="input-group">
                    <label>Name:</label>
                    <input type="text" name="Name" required placeholder="अपना नाम लिखें">
                </div>

                <div class="input-group">
                    <label>Date of Birth:</label>
                    <input type="date" name="DOB" required>
                </div>

                <!-- Gmail के ठीक ऊपर फ़ोन नंबर का ऑप्शन जोड़ दिया गया है -->
                <div class="input-group">
                    <label>Phone Number:</label>
                    <input type="tel" name="Phone" required placeholder="अपना फ़ोन नंबर लिखें" pattern="[0-9]{10}">
                </div>

                <div class="input-group">
                    <label>Gmail:</label>
                    <input type="email" name="Email" required placeholder="अपनी Gmail आईडी लिखें">
                </div>

                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </div>

    <script>
        function openForm() {
            document.getElementById('signupModal').style.display = 'flex';
        }

        function closeForm() {
            document.getElementById('signupModal').style.display = 'none';
        }
    </script>

</body>
</html>
