<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naresh Indian Hacker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            margin: 30px auto;
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.25);
            border: 1px solid #334155;
        }
        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            margin-bottom: 15px;
        }
        h1 {
            color: #00ff88;
            font-size: 1.8rem;
            margin: 10px 0 5px 0;
        }
        .tagline {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        .skills-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid #334155;
        }
        .skills-title {
            color: #00ff88;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .skills-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        .tag {
            background: #334155;
            color: #e2e8f0;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
        }
        .btn {
            display: block;
            width: 90%;
            margin: 12px auto;
            padding: 12px 0;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            transition: 0.3s;
            font-size: 0.95rem;
        }
        .btn-github {
            background-color: #24292e;
            border: 1px solid #444c56;
        }
        .btn-insta {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }
        .btn-yt {
            background-color: #ff0000;
        }
        .btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Photo -->
        <img src="file_00000000f45c71f4b4777bfb557ca3ca.png" alt="Naresh" class="profile-pic">

        <h1>Naresh Indian Hacker</h1>
        <div class="tagline">Welcome to my official profile page!</div>

        <!-- Skills Section -->
        <div class="skills-box">
            <div class="skills-title">🚀 What I Do / Learning</div>
            <div class="skills-tags">
                <span class="tag">Python</span>
                <span class="tag">Cyber Security</span>
                <span class="tag">Web Development</span>
                <span class="tag">Tech Content</span>
            </div>
        </div>

        <!-- Social Links -->
        <a href="https://github.com/allindianhacker21-ops" class="btn btn-github" target="_blank">💻 GitHub Profile</a>
        <a href="https://instagram.com/ankitandnaresh" class="btn btn-insta" target="_blank">📸 Follow on Instagram</a>
        <a href="https://www.youtube.com/@NareshIndianHacker" class="btn btn-yt" target="_blank">▶️ Subscribe on YouTube</a>
    </div>

</body>
</html>
