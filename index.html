<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naresh Indian Hacker</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-color: #00ff66;
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
      --border-color: #30363d;
      --btn-yellow: #ffb703;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .header-btns {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .top-btn {
      background: #21262d;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .profile-section {
      text-align: center;
      margin-bottom: 24px;
    }

    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid var(--accent-color);
      object-fit: cover;
      margin-bottom: 12px;
    }

    .profile-title {
      font-size: 1.5rem;
      color: var(--accent-color);
      font-weight: bold;
      margin-bottom: 4px;
    }

    .profile-subtitle {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .about-card {
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      text-align: left;
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .about-card h3 {
      color: var(--text-main);
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    .btn-primary {
      background: var(--btn-yellow);
      color: #000;
    }

    .btn-secondary {
      background: #21262d;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: #1c2128;
      border: 1px solid var(--accent-color);
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }

    .modal-title {
      font-size: 1.2rem;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .modal-sub {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 20px;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #0d1117;
      color: var(--text-main);
      margin-bottom: 16px;
      font-size: 1rem;
      text-align: center;
    }

    .error-box {
      color: #ff4d4d;
      font-size: 0.8rem;
      margin-top: 10px;
      word-break: break-word;
      display: none;
    }

    .success-box {
      color: var(--accent-color);
      font-size: 0.9rem;
      margin-top: 10px;
      display: none;
    }

    #recaptcha-container {
      margin: 10px auto;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-btns">
      <button class="top-btn" onclick="openModal()">🔐 Login</button>
      <a href="#" class="top-btn">📩 Contact Us</a>
    </div>

    <div class="profile-section">
      <img src="https://via.placeholder.com/100" alt="Profile" class="profile-img">
      <h2 class="profile-title">Naresh Indian Hacker</h2>
      <p class="profile-subtitle">Welcome to my official profile page!</p>
    </div>

    <div class="about-card">
      <h3>🙋‍♂️ About Me</h3>
      <p>Namaste! Main Naresh hoon. Mujhe Cyber Security, Ethical Hacking, Python programming aur Tech content create karne me kaafi interest hai.</p>
    </div>
  </div>

  <!-- OTP Verification Modal -->
  <div class="modal-overlay" id="otpModal">
    <div class="modal-content">
      <h3 class="modal-title">📱 OTP Verification</h3>
      <p class="modal-sub">Naresh Batch Access Ke Liye SMS OTP Verify Karein.</p>

      <div id="phone-step">
        <input type="tel" id="phoneNumber" class="input-field" placeholder="Aapka Mobile Number (10 Digits)" maxlength="10">
        <div id="recaptcha-container"></div>
        <button class="btn-action btn-primary" onclick="sendOTP()">Send OTP SMS 📩</button>
      </div>

      <div id="otp-step" style="display: none;">
        <input type="number" id="otpCode" class="input-field" placeholder="Enter 6-Digit OTP" maxlength="6">
        <button class="btn-action btn-primary" onclick="verifyOTP()">Verify OTP ✅</button>
      </div>

      <button class="btn-action btn-secondary" onclick="closeModal()">Cancel</button>

      <div class="error-box" id="errorMsg"></div>
      <div class="success-box" id="successMsg"></div>
    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAE_e6bBLVg6mh2R1tbGqUDgdC0sikNtvw",
      authDomain: "naresh-indian-hacker.firebaseapp.com",
      projectId: "naresh-indian-hacker",
      storageBucket: "naresh-indian-hacker.firebasestorage.app",
      messagingSenderId: "537910000098",
      appId: "1:537910000098:web:1889e23ee6b6cf9758e1bb",
      measurementId: "G-7VQLVRBSBZ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    auth.languageCode = 'en';

    window.auth = auth;
    window.RecaptchaVerifier = RecaptchaVerifier;
    window.signInWithPhoneNumber = signInWithPhoneNumber;
  </script>

  <script>
    let confirmationResultObj = null;

    function openModal() {
      document.getElementById('otpModal').style.display = 'flex';
      initRecaptcha();
    }

    function closeModal() {
      document.getElementById('otpModal').style.display = 'none';
      resetForm();
    }

    function resetForm() {
      document.getElementById('phone-step').style.display = 'block';
      document.getElementById('otp-step').style.display = 'none';
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('successMsg').style.display = 'none';
      document.getElementById('phoneNumber').value = '';
      document.getElementById('otpCode').value = '';
    }

    function initRecaptcha() {
      if (!window.recaptchaVerifier) {
        window.recaptchaVerifier = new window.RecaptchaVerifier(window.auth, 'recaptcha-container', {
          'size': 'invisible'
        });
      }
    }

    function sendOTP() {
      const phoneNum = document.getElementById('phoneNumber').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');

      errorMsg.style.display = 'none';

      if (phoneNum.length !== 10) {
        errorMsg.innerText = "Kripya sahi 10-digit mobile number daalein.";
        errorMsg.style.display = 'block';
        return;
      }

      const fullPhoneNum = "+91" + phoneNum;
      const appVerifier = window.recaptchaVerifier;

      window.signInWithPhoneNumber(window.auth, fullPhoneNum, appVerifier)
        .then((confirmationResult) => {
          confirmationResultObj = confirmationResult;
          document.getElementById('phone-step').style.display = 'none';
          document.getElementById('otp-step').style.display = 'block';
          successMsg.innerText = "OTP SMS bhej diya gaya hai!";
          successMsg.style.display = 'block';
        })
        .catch((error) => {
          errorMsg.innerText = "Error: " + (error.message || JSON.stringify(error));
          errorMsg.style.display = 'block';
        });
    }

    function verifyOTP() {
      const otpCode = document.getElementById('otpCode').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');

      errorMsg.style.display = 'none';

      if (otpCode.length !== 6) {
        errorMsg.innerText = "Kripya 6-digit OTP enter karein.";
        errorMsg.style.display = 'block';
        return;
      }

      confirmationResultObj.confirm(otpCode).then((result) => {
        successMsg.innerText = "Verification Successful! 🎉";
        successMsg.style.display = 'block';
        document.getElementById('otp-step').style.display = 'none';
      }).catch((error) => {
        errorMsg.innerText = "Galat OTP! Kripya dubara try karein.";
        errorMsg.style.display = 'block';
      });
    }
  </script>
</body>
</html>
