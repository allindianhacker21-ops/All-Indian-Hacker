<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Indian Hacker</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        /* टॉप बार में बटन एलाइन करने के लिए */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding-right: 20px;
            margin-top: 20px;
        }

        .action-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
            transition: 0.3s;
        }

        .action-btn:hover {
            background-color: darkred;
        }

        .action-btn.login-btn {
            background-color: #222;
            border: 1px solid red;
        }

        .action-btn.login-btn:hover {
            background-color: red;
        }

        /* पॉपअप overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .box {
            background: #111111;
            border: 1px solid red;
            padding: 25px;
            border-radius: 8px;
            width: 290px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            position: relative;
        }

        .box h2 {
            color: red;
            margin-top: 0;
            font-size: 20px;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: red;
            font-size: 22px;
            cursor: pointer;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ddd;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            outline: none;
        }

        .input-group input:focus {
            border-color: red;
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>

    <h1>All Indian Hacker</h1>

    <!-- दाएं तरफ Login और Sign Up बटन -->
    <div class="top-bar">
        <button class="action-btn login-btn" onclick="openModal('loginModal')">Login</button>
        <button class="action-btn" onclick="openModal('signupModal')">Sign Up</button>
    </div>

    <!-- SIGN UP MODAL -->
    <div class="modal-overlay" id="signupModal">
        <div class="box">
            <span class="close-btn" onclick="closeModal('signupModal')">&times;</span>
            <h2>Sign Up</h2>
            <form action="https://formspree.io/f/mljrwyeo" method="POST">
                <input type="hidden" name="Form_Type" value="Sign Up">
                <div class="input-group">
                    <label>Name:</label>
                    <input type="text" name="Name" required placeholder="अपना नाम लिखें">
                </div>

                <div class="input-group">
                    <label>Date of Birth:</label>
                    <input type="date" name="DOB" required>
                </div>

                <div class="input-group">
                    <label>Phone Number:</label>
                    <input type="tel" name="Phone" required placeholder="अपना फ़ोन नंबर लिखें" pattern="[0-9]{10}">
                </div>

                <div class="input-group">
                    <label>Gmail:</label>
                    <input type="email" name="Email" required placeholder="अपनी Gmail आईडी लिखें">
                </div>

                <button type="submit" class="submit-btn">Sign Up</button>
            </form>
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div class="modal-overlay" id="loginModal">
        <div class="box">
            <span class="close-btn" onclick="closeModal('loginModal')">&times;</span>
            <h2>Login</h2>
            <form action="https://formspree.io/f/mljrwyeo" method="POST">
                <input type="hidden" name="Form_Type" value="Login">
                <div class="input-group">
                    <label>Gmail / Username:</label>
                    <input type="text" name="Login_User" required placeholder="अपनी Gmail या Username लिखें">
                </div>

                <div class="input-group">
                    <label>Password:</label>
                    <input type="password" name="Password" required placeholder="पासवर्ड लिखें">
                </div>

                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>
    </div>

    <script>
        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    </script>

</body>
</html>
