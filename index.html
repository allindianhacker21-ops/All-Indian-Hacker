<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Indian Hacker</title>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // आपकी Public Key
            emailjs.init("zEXmh31UhCjOE3oVU");
        })();
    </script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 10px;
        }

        h1 {
            color: red;
            text-align: center;
            margin: 0;
            font-size: 24px;
        }

        .action-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
            transition: 0.3s;
        }

        .action-btn:hover { background-color: darkred; }

        .login-btn {
            background-color: #222;
            border: 1px solid red;
        }

        .login-btn:hover { background-color: red; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .box {
            background: #111111;
            border: 1px solid red;
            padding: 25px;
            border-radius: 8px;
            width: 290px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            position: relative;
        }

        .box h2 {
            color: red;
            margin-top: 0;
            font-size: 20px;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: red;
            font-size: 22px;
            cursor: pointer;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ddd;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            outline: none;
        }

        .input-group input:focus { border-color: red; }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover { background-color: darkred; }
    </style>
</head>
<body>

    <div class="header-container">
        <button class="action-btn login-btn" onclick="openModal('loginModal')">Login</button>
        <h1>All Indian Hacker</h1>
        <button class="action-btn" onclick="openModal('signupModal')">Sign Up</button>
    </div>

    <!-- SIGN UP MODAL -->
    <div class="modal-overlay" id="signupModal">
        <div class="box">
            <span class="close-btn" onclick="closeModal('signupModal')">&times;</span>
            <h2>Sign Up</h2>
            <form action="https://formspree.io/f/xvkpbjln" method="POST">
                <input type="hidden" name="Form_Type" value="Sign Up">
                <div class="input-group">
                    <label>Name:</label>
                    <input type="text" name="Name" required placeholder="अपना नाम लिखें">
                </div>
                <div class="input-group">
                    <label>Date of Birth:</label>
                    <input type="date" name="DOB" required>
                </div>
                <div class="input-group">
                    <label>Phone Number:</label>
                    <input type="tel" name="Phone" required placeholder="अपना फ़ोन नंबर लिखें" pattern="[0-9]{10}">
                </div>
                <div class="input-group">
                    <label>Gmail:</label>
                    <input type="email" name="Email" required placeholder="अपनी Gmail आईडी लिखें">
                </div>
                <button type="submit" class="submit-btn">Sign Up</button>
            </form>
        </div>
    </div>

    <!-- LOGIN MODAL WITH REAL EMAIL OTP -->
    <div class="modal-overlay" id="loginModal">
        <div class="box">
            <span class="close-btn" onclick="closeModal('loginModal')">&times;</span>
            <h2>Login</h2>
            
            <!-- Step 1: Gmail Input Form -->
            <form id="loginForm" onsubmit="sendOTP(event)">
                <div class="input-group">
                    <label>Gmail:</label>
                    <input type="email" id="userEmail" required placeholder="अपनी Gmail लिखें">
                </div>
                <div class="input-group">
                    <label>Phone Number:</label>
                    <input type="tel" id="userPhone" required placeholder="अपना फ़ोन नंबर लिखें" pattern="[0-9]{10}">
                </div>
                <button type="submit" class="submit-btn" id="sendBtn">Send OTP</button>
            </form>

            <!-- Step 2: OTP Verification Form -->
            <form id="otpForm" style="display:none;" onsubmit="verifyOTP(event)">
                <div class="input-group">
                    <label>Enter OTP Code:</label>
                    <input type="text" id="otpInput" required placeholder="Gmail पर आया OTP लिखें">
                </div>
                <button type="submit" class="submit-btn">Verify & Proceed</button>
            </form>
        </div>
    </div>

    <script>
        let generatedOTP = null;

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function sendOTP(e) {
            e.preventDefault();
            const email = document.getElementById('userEmail').value;
            const btn = document.getElementById('sendBtn');
            
            // 6 अंकों का OTP कोड जनरेट करें
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            btn.innerText = "Sending OTP...";

            // EmailJS के ज़रिए असली Gmail पर OTP भेजें
            emailjs.send("service_bnq0is", "template_y1smpoj", {
                email: email,
                passcode: generatedOTP
            }).then(() => {
                alert("OTP आपकी Gmail पर सफलतापूर्वक भेज दिया गया है!");
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('otpForm').style.display = 'block';
            }, (err) => {
                alert("OTP भेजने में समस्या आई! कृपया पुनः प्रयास करें।");
                btn.innerText = "Send OTP";
            });
        }

        function verifyOTP(e) {
            e.preventDefault();
            const inputOTP = document.getElementById('otpInput').value;

            if (inputOTP === generatedOTP) {
                alert("वेरीफिकेशन सफल रहा! नए पेज पर रिडायरेक्ट किया जा रहा है...");
                // OTP वेरीफाई होने के बाद यहाँ नया पेज खुलेगा
                window.location.href = "welcome.html";
            } else {
                alert("गलत OTP! सही कोड डालें।");
            }
        }
    </script>

</body>
</html>
